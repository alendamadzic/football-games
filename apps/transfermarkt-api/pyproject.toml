[project]
name = "transfermarkt-api"
version = "3.0.0"
description = "API service to get data from Transfermarkt"
requires-python = ">=3.12,<4.0"
dependencies = [
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "slowapi==0.1.10",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.5",
    "python-dateutil==2.9.0.post0",
]

[tool.poetry]
name = "transfermarkt-api"
version = "3.0.0"
description = "API service to get data from Transfermarkt"
authors = ["Felipe Allegretti <felipe@allegretti.me>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
lxml = "==6.1.3"
beautifulsoup4 = "==4.15.0"
requests = "==2.34.2"
fastapi = "==0.141.1"
uvicorn = {extras = ["standard"], version = "==0.53.0"}
slowapi = "==0.1.10"
pydantic-settings = "==2.15.0"
pydantic= "==2.13.5"
python-dateutil = "==2.9.0.post0"

[tool.poetry.group.dev.dependencies]
jupyter = "==1.0.0"
setuptools = "==68.2.2"

[tool.poetry.group.check.dependencies]
black = "==26.5.1"
ruff = "==0.16.7"
interrogate = "==1.7.0"

[tool.poetry.group.tests.dependencies]
pytest = "==9.1.1"
pytest-cov = "==7.1.0"
schema = "==0.7.8"

[tool.black]
line-length = 120
verbose = true
preview = true

[tool.ruff]
preview = true
unsafe-fixes = true
line-length = 120
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "COM",  # flake8-commas
    "Q",  # flake8-quotes
    "FAST",  # fastapi
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --exitfirst"
testpaths = [
    "tests",
]

[tool.interrogate]
ignore-init-module = true
ignore-module = true
fail-under = 100

[dependency-groups]
dev = [
    "black==26.5.1",
    "interrogate==1.7.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.7",
    "schema==0.7.8",
]
